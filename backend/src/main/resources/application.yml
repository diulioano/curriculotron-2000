spring:
  application:
    name: curriculotron
  main:
    banner-mode: off
  flyway:
    locations: classpath:db/migration
  # Esquema é do Flyway; o Hibernate só mapeia (D-03).
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
  jackson:
    default-property-inclusion: always
  threads:
    virtual:
      enabled: true

server:
  port: ${CURRICULOTRON_PORT:8443}
  address: ${CURRICULOTRON_BIND:0.0.0.0}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${CURRICULOTRON_SESSION_IDLE:30m}
      tracking-modes: cookie
      cookie:
        name: CURRICULOTRON_SESSION
        http-only: true
        secure: true
        same-site: strict
  # HTTPS com certificado PEM gerado por mkcert (D-06). Ver scripts/setup-lan-https.ps1.
  ssl:
    enabled: ${CURRICULOTRON_TLS_ENABLED:true}
    certificate: file:${curriculotron.tls.certificate}
    certificate-private-key: file:${curriculotron.tls.private-key}

  forward-headers-strategy: none

curriculotron:
  # %LOCALAPPDATA%\Curriculotron (D-03)
  home-dir: ${CURRICULOTRON_HOME:${LOCALAPPDATA:${user.home}}/Curriculotron}
  data-dir: ${curriculotron.home-dir}/data
  tls:
    certificate: ${CURRICULOTRON_TLS_CERT:${curriculotron.home-dir}/certs/curriculotron.pem}
    private-key: ${CURRICULOTRON_TLS_KEY:${curriculotron.home-dir}/certs/curriculotron-key.pem}
  # Se definido, importa o currículo no primeiro start (FR-001)
  resume-file: ${CURRICULOTRON_RESUME_FILE:}
  login:
    max-attempts: 5
    lock-duration: 5m
  scheduler:
    enabled: true
    tick-ms: 60000

logging:
  level:
    root: INFO
    org.springframework.security: WARN
