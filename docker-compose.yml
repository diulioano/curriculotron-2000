services:
  backend:
    image: curriculotron-backend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    init: true
    restart: unless-stopped
    environment:
      CURRICULOTRON_PORT: "8443"
      CURRICULOTRON_HOME: /var/lib/curriculotron
      CURRICULOTRON_TLS_ENABLED: "false"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
    expose:
      - "8443"
    volumes:
      - curriculotron-data:/var/lib/curriculotron
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8443/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    image: curriculotron-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CURRICULOTRON_HOST_PORT:-8080}:80"

volumes:
  curriculotron-data:
